name: CI

# Every pull request into main must pass this before it is merged, and main itself is
# re-checked after the merge in case two green PRs conflict semantically.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Central package management means Directory.Packages.props holds every version,
      # so it plus the project files decide what a restore would download.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # Release, which ImageSharp's licence check treats as a hard error rather than a
      # warning, so the key has to be present for the build to run at all. A pull request
      # opened from a fork cannot read the secret and will fail here.
      - name: Build
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet build --no-restore --configuration Release

      # The tests use SQLite in memory, so no container runtime and no credentials.
      - name: Test
        run: >
          dotnet test
          --no-build
          --configuration Release
          --settings coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

      # Coverlet writes the report into a folder named for a GUID, so the path can only
      # be a glob, and a glob that stops matching would leave the upload below silently
      # empty. Fail here instead: a report we did not produce is our problem, where a bad
      # day at Coveralls is not.
      - name: Check the coverage report was written
        run: ls TestResults/*/coverage.cobertura.xml

      # Updates the README badge from main and comments the change on a pull request.
      # github.token is enough for a public repository, so there is no Coveralls secret
      # to keep. Reporting coverage is not what the merge gate is for, so an outage at
      # their end leaves the run green rather than blocking the branch.
      - name: Report coverage
        uses: coverallsapp/github-action@v2
        with:
          file: TestResults/*/coverage.cobertura.xml
          format: cobertura
          # Coverlet writes filenames relative to <sources>, which is src/, not the
          # repository root. Point Coveralls at the same place or it resolves none of
          # them and reports on a subset it pieced together.
          base-path: src
          fail-on-error: false
